<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/maps"></ion-back-button>
    </ion-buttons>
    <ion-title>Edit Point</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Edit Titik Lokasi</ion-card-title>
      <ion-card-subtitle>Geser marker pada peta untuk mengubah koordinat</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-input type="text" label="Name" labelPlacement="floating" placeholder="Masukkan nama lokasi"
          [(ngModel)]="name">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input type="text" label="Coordinates" labelPlacement="floating" placeholder="Contoh: -7.7956,110.3695"
          [(ngModel)]="coordinates">
        </ion-input>
      </ion-item>

      <ion-button expand="block" class="ion-margin-top" (click)="save()">
        Save
      </ion-button>
    </ion-card-content>
  </ion-card>

  <div id="mapedit"></div>
</ion-content>
