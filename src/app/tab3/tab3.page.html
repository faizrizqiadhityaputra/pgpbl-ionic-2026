<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Formulir Tambahan Mata Kuliah
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-input label="Mata Kuliah" placeholder="Masukkan Mata Kuliah"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Waktu" placeholder="Masukkan Waktu"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Dosen" placeholder="Masukkan Dosen"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Ruang" placeholder="Masukkan Ruang"></ion-input>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
  <ion-button shape="block">Simpan</ion-button>
